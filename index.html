<!--
  Svelte 5 Spatial Sandbox Host Document.
  What: HTML5 entry shell containing the root mounting container and module script import.
  When: Requested by the browser on initial navigation to http://localhost:5173.
  Why: Serves the baseline viewport meta, title, and initial DOM container (#app) for Svelte 5 hydration.
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Svelte 5 & TypeScript Sandbox</title>
  </head>
  <body>
    <!-- Root Svelte 5 application mounting target -->
    <div id="app"></div>
    <!-- Application bootstrap script entry -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
